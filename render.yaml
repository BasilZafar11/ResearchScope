services:
  - type: web
    name: researchscope-api
    plan: free
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_ENABLED
        value: "false"
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: IP_HASH_SECRET
        sync: false
      - key: HOSTED_REPORTS_PER_IP_PER_DAY
        value: "2"
      - key: HOSTED_SERPAPI_DAILY_BUDGET
        value: "100"
      - key: HOSTED_SERPAPI_RESERVE
        value: "40"
      - key: LIVE_SERPAPI_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: researchscope-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
